# Go-live profile: mvn spring-boot:run -Dspring-boot.run.profiles=prod,mysql
# Or: java -jar app.jar --spring.profiles.active=prod

spring.thymeleaf.cache=true
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

server.error.include-stacktrace=never
server.error.include-message=on_param
server.error.include-binding-errors=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

spring.jpa.show-sql=false

# Harden session cookie in HTTPS deployments (set secure=true behind TLS terminator)
server.servlet.session.cookie.secure=true

hms.operation-mode=production
