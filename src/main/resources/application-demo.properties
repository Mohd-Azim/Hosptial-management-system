# In-memory H2 demo — no MySQL required.
# Run: mvn spring-boot:run -Dspring-boot.run.profiles=demo
# HTTP: prefers 8081 if free; otherwise next free port (see logs). H2 console: /h2-console  (JDBC jdbc:h2:mem:hmsdemo, user sa, empty password)

spring.datasource.url=jdbc:h2:mem:hmsdemo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Schema from JPA entities (db/schema.sql is MySQL-specific)
spring.sql.init.mode=never

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Avoid clashing with another process on 8080
server.port=8081

# Single JVM context for in-memory H2 (DevTools restart closes the DB)
spring.devtools.restart.enabled=false

# Demo runs without Redis (in-memory queue + inbox + JVM striped pharmacy locks)
hms.redis.enabled=false
