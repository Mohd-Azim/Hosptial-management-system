<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head><title>Misc expenses</title></head>
<body>
<section layout:fragment="content">
  <div class="hms-card">
    <h1>Miscellaneous expenses</h1>
    <label class="hms-field-label" for="misc-filter">Search</label>
    <input type="search" id="misc-filter" class="hms-input-search" placeholder="Category or amount…" autocomplete="off"/>
    <table class="hms-table hms-table-filterable" id="misc-table" th:if="${!expenses.isEmpty()}">
      <thead><tr><th>Date</th><th>Category</th><th>Amount</th></tr></thead>
      <tbody>
      <tr th:each="e : ${expenses}"
          th:attr="data-search=${#strings.toLowerCase(e.expenseDate + ' ' + e.category + ' ' + e.amount)}">
        <td th:text="${e.expenseDate}">—</td>
        <td th:text="${e.category}">—</td>
        <td th:text="${e.amount}">—</td>
      </tr>
      </tbody>
    </table>
    <p class="hms-muted" th:if="${expenses.isEmpty()}">No expenses in range.</p>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.HMS && HMS.bindTableFilter) {
        HMS.bindTableFilter('#misc-filter', '#misc-table', 'data-search');
      }
    });
  </script>
</section>
</body>
</html>
