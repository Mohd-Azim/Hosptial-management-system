spring.application.name=hospital-management-system

# Preferred port; if busy, next ports are tried (see AvailablePortWebServerCustomizer). Optional: hms.server.port-max-attempts=64
server.port=8080

# MySQL (override locally if needed)
spring.datasource.url=jdbc:mysql://localhost:3306/hms_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Kolkata
spring.datasource.username=hms
spring.datasource.password=hms_pass

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Run classpath:db/schema.sql on startup (creates tables + seed roles)
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.continue-on-error=true

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Session cookie (browser clients)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

spring.thymeleaf.cache=false
hms.feature.soft-delete=true
hms.feature.pay-first=true
hms.admission-fee=5000

# Redis (set hms.redis.enabled=true and run Redis for distributed queue/cache/locks)
hms.redis.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

# Async notification consumer + inbox
hms.notifications.poll-ms=400
hms.notifications.batch-size=32
hms.notifications.inbox-cap-per-user=100
hms.presence.ttl-minutes=15

# Patient prefix search (Redis cache optional)
hms.search.patient.min-chars=2
hms.search.patient.limit=24
hms.search.patient.cache-ttl-seconds=45

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
