<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#141218"/>
  <title>Sign in — HMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/hms.css}"/>
</head>
<body class="hms-auth-body">
  <div class="hms-card hms-auth-card">
    <div class="hms-auth-logo"><span class="material-symbols-outlined" aria-hidden="true">local_hospital</span></div>
    <h1 style="margin:0 0 0.5rem;text-align:center;font-size:1.375rem;font-weight:400;">Sign in</h1>
    <p class="hms-muted" style="margin:0 0 1.25rem;text-align:center;">Hospital management system</p>
    <div class="hms-alert" th:if="${error}" th:text="${error}"></div>
    <form class="hms-form" th:action="@{/login}" method="post">
      <input type="hidden" name="redirect" th:value="${redirect}" th:if="${redirect != null}"/>
      <label>Username</label>
      <input name="username" autocomplete="username" required th:value="${username}"/>
      <label>Password</label>
      <input type="password" name="password" autocomplete="current-password" required/>
      <button type="submit" class="hms-btn" style="width:100%;margin-top:0.25rem;">Sign in</button>
    </form>
    <p class="hms-muted" style="margin-top:1.25rem;text-align:center;font-size:0.8125rem;">
      <a th:href="@{/register}">Create patient account</a>
    </p>
  </div>
</body>
</html>
