<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#141218"/>
  <title>Register — HMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
  <link rel="stylesheet" th:href="@{/css/hms.css}"/>
</head>
<body class="hms-auth-body">
  <div class="hms-card hms-auth-card hms-auth-card--wide">
    <div class="hms-auth-logo"><span class="material-symbols-outlined" aria-hidden="true">person_add</span></div>
    <h1 style="margin:0 0 0.5rem;text-align:center;font-size:1.375rem;font-weight:400;">Patient registration</h1>
    <p class="hms-muted" style="margin:0 0 1.25rem;text-align:center;">Creates a portal login with MRN.</p>
    <div class="hms-alert" th:if="${error}" th:text="${error}"></div>
    <form class="hms-form" th:action="@{/register}" method="post">
      <label>Username</label>
      <input name="username" required th:value="${username}"/>
      <label>Email</label>
      <input type="email" name="email" required th:value="${email}"/>
      <label>Full name</label>
      <input name="fullName" required th:value="${fullName}"/>
      <label>Phone</label>
      <input name="phone"/>
      <label>Blood group</label>
      <input name="bloodGroup" placeholder="e.g. O+"/>
      <label>Password</label>
      <input type="password" name="password" required/>
      <button type="submit" class="hms-btn" style="width:100%;margin-top:0.25rem;">Register</button>
    </form>
    <p class="hms-muted" style="margin-top:1.25rem;text-align:center;"><a th:href="@{/login}">Back to sign in</a></p>
  </div>
</body>
</html>
